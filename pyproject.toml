[project]
name = "cumcm-mathmodel-skill"
version = "0.1.0"
description = "CUMCM end-to-end workflow skill pack for Claude Code and Codex"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "python-docx==1.2.0",
    "pytest>=8.0,<9",
    "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
